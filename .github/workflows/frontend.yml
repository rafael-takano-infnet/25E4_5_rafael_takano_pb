name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Resumir resultados do frontend
        run: |
          echo "## CI do Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ambiente: Node.js 22" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comando: \`npm ci && npm run build\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Saída: \`frontend/dist\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefato do frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
