name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Explicar escolha do Maven
        run: |
          echo "::notice title=Ferramenta de build::O TP5 pediu Gradle, mas este repositório mantém Maven de forma intencional."
          echo "O Maven foi preservado para evitar uma migração de baixo valor após a refatoração do TP4."

      - name: Run backend verification
        run: mvn -B verify

      - name: Resumir resultados do backend
        run: |
          echo "## CI do Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ferramenta de build: Maven (desvio documentado em relação ao enunciado do TP5)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: 21" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comando: \`mvn -B verify\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regra de cobertura: 90% de cobertura de instruções" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore
